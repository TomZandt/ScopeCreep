[workspace]
resolver = "3"
members = ["feed", "app", "accuracy"]
default-members = ["feed", "app"]

[workspace.package]
version = "0.3.1"
edition = "2024"
publish = false

# Clippy's style lints below fight deliberate choices: index loops over fixed
# grids, NaN-aware negated comparisons, constant checks in token tests.
[workspace.lints.clippy]
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
assertions_on_constants = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
