name: release

# A Test build (spec #233, ticket #242): "Run workflow" on any branch builds the Installer for every
# platform in packaging/platforms.txt and keeps it as a workflow artifact for 30 days. It never publishes.
# A Release (ticket #243): pushing a `vX.Y.Z` tag builds the same Installers, then the publish job checks
# the tag against the workspace version and the changelog and publishes a GitHub pre-release (while 0.y.z).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # The official OpenFX headers, pinned. They lack Resolve's ofxImageEffectExt.h: sender/ci has a stand-in.
  OFX_REPO: AcademySoftwareFoundation/openfx
  OFX_REF: OFX_Release_1.5.1

jobs:
  platforms:
    name: platforms
    runs-on: ubuntu-22.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # A bad tag fails here, before any build.
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      # Windows and macOS ports add their runner to the build job and lift this check.
      - id: list
        name: Read packaging/platforms.txt
        run: |
          for p in $(scripts/platforms.sh); do
            [[ $p == linux ]] || { echo "::error::platform '$p' is in packaging/platforms.txt but release.yml has no runner for it"; exit 1; }
          done
          list=$(scripts/platforms.sh --json)
          echo "platforms: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: platforms
    # Windows and macOS ports add their runner here and their steps below, guarded by matrix.platform.
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-22.04' || 'unsupported' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Workspace version
        id: version
        run: echo "version=$(scripts/workspace-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: cargo build --release -p scopecreep

      # The Sender needs only the CUDA runtime headers and libcudart_static.a, so the dev package
      # (no nvcc, no driver, no GPU) is enough. Ubuntu 22.04 ships it as CUDA 11.5, pinned by the runner image.
      - name: CUDA runtime (no GPU)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nvidia-cuda-dev
          # The Makefile wants CUDA_HOME/include and CUDA_HOME/lib64.
          mkdir -p "$RUNNER_TEMP/cuda"
          ln -s /usr/include "$RUNNER_TEMP/cuda/include"
          ln -s /usr/lib/x86_64-linux-gnu "$RUNNER_TEMP/cuda/lib64"
          test -f /usr/include/cuda_runtime.h
          test -f /usr/lib/x86_64-linux-gnu/libcudart_static.a

      - name: OpenFX headers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OFX_REPO }}
          ref: ${{ env.OFX_REF }}
          path: openfx

      - name: Build the Sender
        run: |
          mkdir -p "$RUNNER_TEMP/ofx-include"
          cp openfx/include/*.h "$RUNNER_TEMP/ofx-include/"
          cp sender/ci/ofxImageEffectExt.h "$RUNNER_TEMP/ofx-include/"
          make -C sender OFX_SDK="$RUNNER_TEMP/ofx-include" CUDA_HOME="$RUNNER_TEMP/cuda"

      - name: Package the Installer
        run: |
          scripts/package-linux.sh "${{ steps.version.outputs.version }}" \
            target/release/scopecreep sender/build/scopecreep_sender.ofx.bundle dist

      - uses: actions/upload-artifact@v4
        with:
          name: scopecreep-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/scopecreep-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    # Only a tag publishes; "Run workflow" never does.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [platforms, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fails the job, before anything is published, if the tag is not the workspace version
      # or the changelog has no section for it.
      - name: Check the tag
        id: tag
        run: echo "version=$(scripts/check-release-tag.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Only platforms listed in packaging/platforms.txt are attached, whatever else was built.
      - name: Gather the Installers
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir dist
          : > included.txt
          for platform in $(scripts/platforms.sh); do
            files=(artifacts/*/scopecreep-"$VERSION"-"$platform"-*.tar.gz)
            [[ -f ${files[0]} ]] || { echo "no Installer for $platform" >&2; exit 1; }
            cp "${files[@]}" dist/
            echo "$platform" >> included.txt
          done
          (cd dist && sha256sum scopecreep-*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # The platforms line goes first so the notes end with the "Full changelog" link.
          {
            echo "Platforms included: $(paste -sd, included.txt | sed 's/,/, /g')."
            echo
            scripts/release-notes.sh "$VERSION"
          } > notes.md
          flags=()
          [[ $VERSION == 0.* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$VERSION" --notes-file notes.md --verify-tag ${flags[@]+"${flags[@]}"}
