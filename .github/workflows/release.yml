name: release

# A Test build (spec #233, ticket #242): "Run workflow" on any branch builds the Installer for every
# platform in packaging/platforms.txt and keeps it as a workflow artifact for 30 days. It never publishes.
# A Release (ticket #243): pushing a `vX.Y.Z` tag builds the Installers of the platforms marked `yes` there
# (the ones Releases include), then the publish job checks the tag against the workspace version and the
# changelog and publishes a GitHub pre-release (while 0.y.z).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# A newer Test build of the same branch replaces one still running; a tag's run is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # The official OpenFX headers, pinned. They lack Resolve's ofxImageEffectExt.h: sender/ci has a stand-in.
  OFX_REPO: AcademySoftwareFoundation/openfx
  OFX_REF: OFX_Release_1.5.1

jobs:
  platforms:
    name: platforms
    runs-on: ubuntu-22.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # A bad tag fails here, before any build.
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      # A tag builds only the platforms Releases include; a Test build builds every platform in the file.
      - id: list
        name: Read packaging/platforms.txt
        run: |
          which=()
          [[ $GITHUB_REF == refs/tags/v* ]] || which=(--test-builds)
          for p in $(scripts/platforms.sh "${which[@]}"); do
            [[ $p == linux || $p == windows || $p == macos ]] || { echo "::error::platform '$p' is in packaging/platforms.txt but release.yml has no runner for it"; exit 1; }
          done
          list=$(scripts/platforms.sh "${which[@]}" --json)
          echo "platforms: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: platforms
    # macos-14 is a hosted Apple Silicon (arm64) runner, which the arm64-only Installer needs.
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-22.04' || matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'macos' && 'macos-14' || 'unsupported' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    # Git Bash on Windows, so every platform runs the same scripts.
    defaults:
      run:
        shell: bash
    steps:
      # Windows' Git would check text out with CRLF line ends, which bash and the scripts' sed do not expect.
      - name: Keep LF line ends
        if: matrix.platform == 'windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Workspace version
        id: version
        run: echo "version=$(scripts/workspace-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: cargo build --release -p scopecreep

      # The Sender needs only the CUDA runtime headers and libcudart_static.a, so the dev package
      # (no nvcc, no driver, no GPU) is enough. Ubuntu 22.04 ships it as CUDA 11.5, pinned by the runner image.
      - name: CUDA runtime (no GPU)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nvidia-cuda-dev
          # The Makefile wants CUDA_HOME/include and CUDA_HOME/lib64.
          mkdir -p "$RUNNER_TEMP/cuda"
          ln -s /usr/include "$RUNNER_TEMP/cuda/include"
          ln -s /usr/lib/x86_64-linux-gnu "$RUNNER_TEMP/cuda/lib64"
          test -f /usr/include/cuda_runtime.h
          test -f /usr/lib/x86_64-linux-gnu/libcudart_static.a

      # On Windows the same two pieces come from NVIDIA's network installer: nvcc (so CMake finds the
      # toolkit) and cudart (headers and cudart_static.lib). No driver, no GPU.
      - name: CUDA toolkit (no GPU)
        if: matrix.platform == 'windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.6.3'
          method: network
          sub-packages: '["nvcc", "cudart"]'

      - name: OpenFX headers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OFX_REPO }}
          ref: ${{ env.OFX_REF }}
          path: openfx

      - name: Build the Sender
        if: matrix.platform == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/ofx-include"
          cp openfx/include/*.h "$RUNNER_TEMP/ofx-include/"
          cp sender/ci/ofxImageEffectExt.h "$RUNNER_TEMP/ofx-include/"
          make -C sender OFX_SDK="$RUNNER_TEMP/ofx-include" CUDA_HOME="$RUNNER_TEMP/cuda"

      # The Windows build entry is CMake (ADR 0050). With no GPU, of the Sender's tests only the one that
      # checks the plugin imports nothing but Windows' own DLLs runs here.
      - name: Build the Sender (Windows)
        if: matrix.platform == 'windows'
        run: |
          ofx="$(cygpath -m "$RUNNER_TEMP")/ofx-include"
          mkdir -p "$ofx"
          cp openfx/include/*.h sender/ci/ofxImageEffectExt.h "$ofx/"
          cmake -S sender -B sender/build/cmake -DOFX_SDK="$ofx"
          cmake --build sender/build/cmake --config Release
          ctest --test-dir sender/build/cmake -C Release -R sender_links_only_system_libraries --output-on-failure

      # The macOS Sender is Metal, built by clang from the same Makefile: no Resolve, no GPU, no CUDA. It
      # needs the pinned OpenFX headers and the stand-in for Resolve's extension header, as the others do.
      - name: Build the Sender (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "$RUNNER_TEMP/ofx-include"
          cp openfx/include/*.h "$RUNNER_TEMP/ofx-include/"
          cp sender/ci/ofxImageEffectExt.h "$RUNNER_TEMP/ofx-include/"
          make -C sender OFX_SDK="$RUNNER_TEMP/ofx-include"
          file sender/build/scopecreep_sender.ofx.bundle/Contents/MacOS/scopecreep_sender.ofx

      - name: Package the Installer
        if: matrix.platform == 'linux'
        run: |
          scripts/package-linux.sh "${{ steps.version.outputs.version }}" \
            target/release/scopecreep sender/build/scopecreep_sender.ofx.bundle dist

      # Inno Setup 6, pinned; packaging/windows/scopecreep.iss needs 6.3 or later.
      - name: Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Package the Installer (Windows)
        if: matrix.platform == 'windows'
        env:
          SCOPECREEP_ISCC: '/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
        run: |
          scripts/package-windows.sh "${{ steps.version.outputs.version }}" \
            target/release/scopecreep.exe sender/build/scopecreep_sender.ofx.bundle dist

      # Unsigned: pkgbuild and productbuild come with macOS.
      - name: Package the Installer (macOS)
        if: matrix.platform == 'macos'
        run: |
          scripts/package-macos.sh "${{ steps.version.outputs.version }}" \
            target/release/scopecreep sender/build/scopecreep_sender.ofx.bundle dist

      - uses: actions/upload-artifact@v4
        with:
          name: scopecreep-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/scopecreep-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    # Only a tag publishes; "Run workflow" never does.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [platforms, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fails the job, before anything is published, if the tag is not the workspace version
      # or the changelog has no section for it.
      - name: Check the tag
        id: tag
        run: echo "version=$(scripts/check-release-tag.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Only platforms listed in packaging/platforms.txt are attached, whatever else was built.
      - name: Gather the Installers
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir dist
          : > included.txt
          for platform in $(scripts/platforms.sh); do
            files=(artifacts/*/scopecreep-"$VERSION"-"$platform"-*)
            [[ -f ${files[0]} ]] || { echo "no Installer for $platform" >&2; exit 1; }
            cp "${files[@]}" dist/
            echo "$platform" >> included.txt
          done
          (cd dist && sha256sum scopecreep-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # The platforms line goes first so the notes end with the "Full changelog" link.
          {
            echo "Platforms included: $(paste -sd, included.txt | sed 's/,/, /g')."
            echo
            scripts/release-notes.sh "$VERSION"
          } > notes.md
          flags=()
          [[ $VERSION == 0.* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/scopecreep-* dist/SHA256SUMS \
            --title "$VERSION" --notes-file notes.md --verify-tag ${flags[@]+"${flags[@]}"}
