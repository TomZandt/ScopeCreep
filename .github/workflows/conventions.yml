name: conventions

on:
  push:
  pull_request:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$HEAD_SHA^!"
          else range="$BEFORE..$HEAD_SHA"; fi
          scripts/check-commits.sh "$range"
      - name: Changelog has an Unreleased section
        run: grep -q '^## \[Unreleased\]' CHANGELOG.md
